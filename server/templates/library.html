{% extends 'base.html' %}
{% block title %}Library · QSYSRadio{% endblock %}
{% block main %}
<div class="section-header">
  <div class="section-title">Library</div>
  <span id="lib-info" class="dim small"></span>
</div>
<section class="tile blue">
  <form id="lib-form" class="toolbar" onsubmit="return false">
    <div class="chip-group" id="kind-tabs">
      <button type="button" class="chip active" data-kind="music">Music</button>
      <button type="button" class="chip" data-kind="imaging">Imaging</button>
      <button type="button" class="chip" data-kind="ad">Ads</button>
    </div>
    <label class="grow">Search <input type="search" id="lib-q" placeholder="artist, title or file"></label>
    <label>Sort
      <select id="lib-sort">
        <option value="artist">Artist</option><option value="title">Title</option>
        <option value="plays">Most played</option><option value="last_played">Recently played</option>
        <option value="least_recent">Least recently played</option>
      </select>
    </label>
    <button type="button" id="btn-rescan" title="Ask the Core to rescan its folders">Rescan</button>
  </form>
  <div class="table-wrap">
    <table class="plays">
      <thead id="lib-head"></thead>
      <tbody id="lib"></tbody>
    </table>
  </div>
  <div class="more"><button type="button" id="lib-more" hidden>Load more</button></div>
  <div id="lib-totals" class="lib-totals"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/library.js') }}?v={{ version }}"></script>{% endblock %}
